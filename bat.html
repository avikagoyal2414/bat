function addParticles(time){const side=Math.random()<.5?-1:1;const x=200+side*(66+Math.random()*24),y=110+Math.random()*32;hearts.push({x,y,t:time,vx:side*(5+Math.random()*7),vy:-12-Math.random()*8});for(let i=0;i<2;i++)dust.push({x:x+(Math.random()-.5)*13,y:y+(Math.random()-.5)*13,t:time,vx:side*(10+Math.random()*10),vy:-5-Math.random()*15})}

// Reference frames are intentionally stepped: crossfading creates doubled wings and ghosting.
const phase=(t%800)/800;const ix=Math.floor(phase*sprites.length)%sprites.length;const img=sprites[ix];
if(img.complete&&img.naturalWidth){const hover=Math.round(Math.sin(t*Math.PI*2/2600)*2);ctx.drawImage(img,90,45+hover,220,164)}
if(ix!==prevIndex){if(ix%3===0)addParticles(t);prevIndex=ix}
for(let i=hearts.length-1;i>=0;i--){let p=hearts[i],age=(t-p.t)/1000;if(age>1.15){hearts.splice(i,1);continue}pixelHeart(p.x+p.vx*age,p.y+p.vy*age,Math.max(0,.8*(1-age/1.15)))}
for(let i=dust.length-1;i>=0;i--){let p=dust[i],age=(t-p.t)/1000;if(age>.8){dust.splice(i,1);continue}ctx.globalAlpha=.5*(1-age/.8);ctx.fillStyle='#343137';ctx.fillRect(Math.round(p.x+p.vx*age),Math.round(p.y+p.vy*age),2,2)}ctx.globalAlpha=1;requestAnimationFrame(frame)}
Promise.all(sprites.map(x=>x.decode().catch(()=>{}))).then(()=>requestAnimationFrame(frame));
